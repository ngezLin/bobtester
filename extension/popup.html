<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BobTester Recorder</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 350px;
      min-height: 400px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      color: #e2e8f0;
      padding: 20px;
    }

    .header {
      text-align: center;
      margin-bottom: 20px;
    }

    .logo {
      font-size: 32px;
      margin-bottom: 8px;
    }

    h1 {
      font-size: 18px;
      font-weight: 600;
      color: #f1f5f9;
    }

    .status {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .status-indicator {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .status-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #64748b;
    }

    .status-dot.recording {
      background: #ef4444;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .status-text {
      font-size: 14px;
      font-weight: 500;
    }

    .actions-count {
      font-size: 12px;
      color: #94a3b8;
    }

    .url-input {
      width: 100%;
      padding: 12px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      color: #e2e8f0;
      font-size: 14px;
      margin-bottom: 12px;
      outline: none;
    }

    .url-input:focus {
      border-color: #3b82f6;
    }

    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      margin-bottom: 8px;
    }

    .btn-primary {
      background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
      color: white;
    }

    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(239, 68, 68, 0.4);
    }

    .btn-secondary {
      background: rgba(59, 130, 246, 0.1);
      color: #3b82f6;
      border: 1px solid rgba(59, 130, 246, 0.2);
    }

    .btn-secondary:hover {
      background: rgba(59, 130, 246, 0.2);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .code-preview {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 12px;
      margin-top: 16px;
      max-height: 200px;
      overflow-y: auto;
      font-family: 'Courier New', monospace;
      font-size: 11px;
      line-height: 1.5;
      color: #94a3b8;
    }

    .footer {
      margin-top: 16px;
      text-align: center;
      font-size: 11px;
      color: #64748b;
    }

    .footer a {
      color: #3b82f6;
      text-decoration: none;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">🎬</div>
    <h1>BobTester Recorder</h1>
  </div>

  <div class="status">
    <div class="status-indicator">
      <div class="status-dot" id="statusDot"></div>
      <span class="status-text" id="statusText">Ready to record</span>
    </div>
    <div class="actions-count" id="actionsCount">0 actions recorded</div>
  </div>

  <div id="startSection">
    <input 
      type="text" 
      class="url-input" 
      id="urlInput" 
      placeholder="https://example.com"
      value="https://example.com"
    >
    <button class="btn btn-primary" id="startBtn">
      ⏺️ Start Recording
    </button>
  </div>

  <div id="recordingSection" class="hidden">
    <button class="btn btn-primary" id="stopBtn">
      ⏹️ Stop Recording
    </button>
    <button class="btn btn-secondary" id="copyBtn">
      📋 Copy Code
    </button>
    <button class="btn btn-secondary" id="clearBtn">
      🗑️ Clear Recording
    </button>
    
    <div class="code-preview" id="codePreview">
      // Actions will appear here...
    </div>
  </div>

  <div class="footer">
    Powered by <a href="https://bobtester.com" target="_blank">BobTester</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
